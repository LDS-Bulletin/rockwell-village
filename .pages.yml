settings:
  commit:
    identity: user
media:
  - name: images
    label: Images
    input: hugo/static/images
    output: /static/images
    rename: safe
content:
  - name: events
    label: Events
    type: collection
    path: hugo/content/events
    exclude:
      - _index.md
    filename:
      template: "{year}-{month}-{day}-{fields.title}.md"
      field: false
    format: toml-frontmatter
    view:
      fields:
        - title
        - date
        - endDate
    fields:
      - name: title
        label: Event Title
        type: string
        required: true
      - name: date
        label: Start Date
        type: date
        required: true
        description: The day this event begins.
      - name: startTime
        label: Start Time
        type: date
        description: The start time of the event.
        default: ''
        options:
          time: true
      - name: endDate
        label: End Date
        type: date
        default: ''
        description: If this event spans multiple days, the date the event ends.
      - name: endTime
        label: End Time
        type: date
        default: ''
        description: The ending time of the event.
        options:
          time: true
      - name: location
        label: Location
        type: string
        description: The location where the event will be held, if applicable.
      - name: body
        label: Details
        type: rich-text
        options:
          media: images
          rename: true
          switcher: true
  - name: sacrament-summary
    label: Sacrament Summary
    type: collection
    path: hugo/content/sacrament-summary
    exclude:
      - _index.md
    filename:
      template: "{fields.date}.md"
      field: false
    format: toml-frontmatter
    view:
      fields:
        - date
    fields:
      - name: date
        label: Date
        type: date
        required: true
      - name: title
        label: Title
        type: string
        required: true
        default: Sacrament Summary
        hidden: true
      - name: listTitle
        label: List Title
        type: string
        default: ''
        hidden: true
      - name: body
        label: Summary
        type: rich-text
        required: true
        options:
          media: images
          rename: true
          switcher: true