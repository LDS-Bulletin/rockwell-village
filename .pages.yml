media:
  - name: images
    label: Images
    input: hugo/static/images
    output: /static/images
    rename: safe
content:
  - name: sacrament-summary
    label: Sacrament Summary
    type: collection
    path: hugo/content/sacrament-summary
    exclude:
      - _index.md
    filename:
      template: "{fields.sacrament-summary-date}.md"
      field: false
    format: toml-frontmatter
    fields:
      - name: sacrament-summary-date
        label: Date
        type: date
        required: true
      - name: sacrament-summary-title
        label: Title
        type: string
        required: true
        default: Sacrament Summary
        hidden: true
      - name: body
        label: Summary
        type: rich-text
        required: true
        options:
          media: images
          rename: true
          switcher: true