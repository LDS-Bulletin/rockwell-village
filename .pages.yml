media:
  - name: images
    label: Images
    input: hugo/static/images
    output: /static/images
    rename: safe
content:
  - name: sacrament-summary
    label: Sacrament Summary
    type: collection
    path: hugo/content/sacrament-summary
    exclude:
      - _index.md
    filename:
      template: "{year}-{month}-{day}.md"
      field: true
    format: toml-frontmatter
    fields:
      - name: date
        label: Date
        type: date
        required: true
      - name: title
        label: Title
        type: string
        required: true
        default: Sacrament Summary
        hidden: true
      - name: listTitle
        label: List Title
        type: string
        default: ''
        hidden: true
      - name: body
        label: Summary
        type: rich-text
        required: true
        options:
          media: images
          rename: true
          switcher: true