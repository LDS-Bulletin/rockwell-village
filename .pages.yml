media:
  - name: images
    label: Images
    input: hugo/static/images
    output: /static/images
    rename: safe
content:
  - name: sacrament-summary
    label: Sacrament Summary
    type: collection
    path: hugo/content/sacrament-summary
    exclude:
      - _index.md
    filename:
      template: "{fields.sacrament-summary-date}.md"
      field: false
    fields:
      - name: sacrament-summary-date
        label: Date
        type: date
        options:
          format: yaml-frontmatter
      - name: sacrament-summary-title
        label: Title
        type: select
        options:
          format: yaml-frontmatter
          values:
            - Sacrament Summary
      - name: sacrament-summary
        label: Summary
        type: rich-text
        options:
          media: images
          rename: true
          switcher: true