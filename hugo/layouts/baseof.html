<!doctype html>
<html lang="{{ site.Language.Locale }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }} | {{ site.Title }}</title>
    {{ $style := resources.Get "styles/main.css" |  resources.Minify | resources.Fingerprint }}
    <link rel="stylesheet" href="{{ "pagefind/pagefind-component-ui.css" | relURL }}" />
    <link rel="stylesheet" href="{{ $style.Permalink }}" />
  </head>
  <body>
    <header class="site-header">
      <a class="site-title" href="{{ "/" | relURL }}">{{ site.Title }}</a>
      <nav class="menu">
        <ul>
          {{ range site.Menus.main }}
            <li><a href="{{ .URL }}"{{ if $.IsMenuCurrent .Menu . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
          {{ end }}
        </ul>
      </nav>
      <div class="search">
        {{ with and .IsPage .File }}
          <a class="edit-link" href="{{ site.Params.editURL }}{{ .Path }}" title="Edit this page on GitHub" aria-label="Edit this page on GitHub">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </a>
        {{ end }}
        <pagefind-modal-trigger compact hide-shortcut></pagefind-modal-trigger>
        <pagefind-modal></pagefind-modal>
      </div>
    </header>
    <main class="page"{{ if .IsPage }} data-pagefind-body{{ end }}>
      {{ block "main" . }}{{ end }}
    </main>
    <footer class="site-footer">© {{ now.Year }} {{ site.Title }}</footer>
    <script src="{{ "pagefind/pagefind-component-ui.js" | relURL }}"></script>
  </body>
</html>
